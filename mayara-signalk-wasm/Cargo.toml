[package]
name = "mayara-signalk-wasm"
version = "0.1.0"
edition = "2021"
description = "Mayara marine radar plugin for SignalK Server (WASM)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"      # Optimize for size
lto = true           # Enable Link Time Optimization
strip = true         # Strip symbols
panic = "abort"      # Abort on panic (smaller binary)
